.coach-finger.down { opacity: 1; }
.coach-finger.jump { transition: none; }
.tut-overlay { position: absolute; inset: 0; z-index: 45; display: grid; place-items: center; padding: 16px; background: rgba(8, 6, 12, 0.55); animation: biIn 260ms ease-out; }
.tut-card { width: min(100%, 420px); padding: 16px 18px 14px; display: grid; gap: 10px; }
.tut-card p { font-size: 15px; line-height: 1.45; color: var(--parch); margin: 0; }

.tut-card .row .btn { min-width: 110px; }
.tut-head { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.tut-head h3 { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.05; color: var(--gilt-hi); margin: 2px 0 0; }
.tut-head .tut-ryley { --px: 2.5px; animation: ryleyBob 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
.tile.guide .face { box-shadow: 0 0 0 3px var(--gilt-hi), 0 0 16px rgba(251, 229, 140, 0.85), inset 0 2px 0 rgba(255, 255, 255, 0.22); animation: guidePulse 1.1s ease-in-out infinite; }

.abil.tut-glow { box-shadow: 0 0 0 3px var(--gilt-hi), 0 0 18px rgba(251, 229, 140, 0.8), 0 2px 0 #0d0a12; animation: guidePulse 1.1s ease-in-out infinite; }
.abil.tut-dim { filter: grayscale(0.7) brightness(0.65); }
.board.tut-swap .tile { animation: tutSwap 380ms ease-out; }
@keyframes tutSwap { from { opacity: 0; } to { opacity: 1; } }
.btn.tut-new { border-color: var(--gilt-dim); color: var(--gilt-hi); }
.help-tut { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; margin-bottom: 10px; font-size: 14px; color: var(--parch-dim); }
@media (prefers-reduced-motion: reduce) { .tile.guide .face, .abil.tut-glow, .tut-head .tut-ryley { animation: none; } }

otion",sub:"Lose your first potion. Gain the Loyal Hound, and it digs up 40 gold.",disabled:!e.player.potions.some(Boolean),go(o,n){return n.dropPotion(o),n.gainRelic(o,"loyal_hound"),n.gainGold(o,40),{text:"It laps up the potion, perks up at once, and digs a buried purse out of the rubble for you."}}},{label:"Shoo it away",sub:"You have no food to spare.",go:()=>({text:"It slinks back into the dark. You feel worse than you expected to."})}]});q("collapsing_gallery",{title:"The Collapsing Gallery",art:"ev_gallery",acts:[1,2,3],text:"A long hall of statues is coming down around you, one column at a time. Something glints in the rubble near the far end.",choices:e=>{let t=5+3*e.act,o=10+4*e.act;return[{label:"Dash for it",sub:`Lose ${t} health. Gain ${40+10*e.act} gold.`,go(n,a){let k=a.loseHp(n,t);return{text:`You sprint through the falling stone, scoop up ${a.gainGold(n,40+10*n.act)} gold and lose ${k} health to the rocks.`}}},{label:"Dig through the rubble",sub:`Better than even odds of a relic. Otherwise lose ${o} health.`,gamble:{kind:"chest",odds:.55},go(n,a){if(a.luck(n,.55)){let r=a.gainRelicOfRarity(n,Co(a.rng(n),.3)?"rare":"uncommon");return{text:`Your fingers close on something solid: the ${a.relicName(r)}. You get out just in time.`}}return{text:`A column comes down where you were kneeling. Mostly. You lose ${a.loseHp(n,o)} health and find nothing.`}}},{label:"Back out",sub:"Live to loot another day.",go:()=>({text:"The gallery thunders shut behind you."})}]}});q("laboratory",{title:"The Abandoned Laboratory",art:"ev_lab",acts:[1,2,3],text:"Glassware crowds every surface, some of it still bubbling. A vat in the corner glows a hopeful shade of green. Notes on the wall end mid-sentence.",choices:e=>[{label:"Combine two potions",sub:"Lose your first two potions. Gain a random rare potion.",disabled:e.player.potions.filter(Boolean).length<2,go(o,n){n.dropPotion(o),n.dropPotion(o);let a=Object.keys(me).filter(r=>me[r].rarity==="rare"&&!(me[r].excl||[]).includes(o.classId)),k=a[Math.floor(Ee(n.rng(o))*a.length)];return n.gainPotion(o,k),{text:`The mixture fizzes, turns clear, then settles into a ${n.potionName(k)}.`}}},{label:"Drink from the vat",sub:"Who knows?",go(o,n){let a=Ee(n.rng(o));return a<.4?(n.heal(o,o.player.maxHp),{text:"It tastes like summer. Every wound you have closes."}):a<.7?(n.maxHp(o,6),{text:"Your heart thumps hard and steady. +6 max health."}):{text:`It was not that kind of green. You lose ${n.loseHp(o,10)} health.`}}},{label:"Pocket some reagents",sub:"Gain a random potion.",disabled:!e.player.potions.includes(null),go(o,n){let a=n.gainPotion(o);return{text:`You find a stoppered ${n.potionName(a)} among the clutter.`}}}]});q("wandering_bard",{title:"The Wandering Bard",art:"ev_bard",acts:[1,2,3],text:'A bard with a lute missing half its strings sits on an overturned bucket. "A song for the road?" he asks. "I know a few that are not even sad."',choices:e=>[{label:"A war song",sub:`Pay 30 gold. Your next 3 fights start with ${e.player.noArmor?"6 health":"8 armor"} and 4 mana.`,disabled:e.player.gold<30,go(t,o){return o.loseGold(t,30),t.flags.warSong=3,{text:"He plays something loud and brave. It sticks in your head, which is the point."}}},{label:"A lullaby",sub:"Heal 15.",go(t,o){return{text:`You doze against the wall while he plays. You wake rested, ${o.heal(t,15)} health better.`}}},{label:"Toss him a coin",sub:"Pay 5 gold. He will remember you.",disabled:e.player.gold<5,go(t,o){return o.loseGold(t,5),{text:"He bows so low his hat falls off. Somewhere, a song about you begins."}}}]});q("echo_cave",{title:"The Echoing Cave",art:"ev_echo",acts:[1,2,3],text:"Every sound you make here comes back larger. Your footsteps return as drumbeats. Your breathing returns as wind.",choices:()=>[{label:"Shout your name",sub:"Gain a level. Enemies in your next fight start with +3 damage.",go(e,t){return t.gainLevel(e),e.flags.echoStr=(e.flags.echoStr||0)+3,{text:"Your name thunders back at you, a hundred times over. You feel bigger. So, somewhere ahead, does something else."}}},{label:"Hum softly",sub:"Heal 8. Enemies in your next fight act 1 turn later.",go(e,t){return t.heal(e,8),e.flags.echoDelay=1,{text:"The hum comes back as a deep, slow chord. Things in the dark ahead grow drowsy."}}},{label:"Tiptoe through",sub:"Say nothing.",go:()=>({text:"Even your silence echoes, somehow."})}]});q("relic_broker",{title:"The Relic Broker",art:"ev_broker",acts:[1,2,3],text:'A woman in a coat lined with a hundred pockets appraises you with a jeweler\u2019s loupe. "I buy anything," she says. "And I sell one thing nobody else will."',choices:e=>{let t=e.player.relics.filter(a=>re[a]&&re[a].rarity!=="curse"),o=t[t.length-1],n=o?{common:70,uncommon:100,rare:140,boss:180}[re[o].rarity]||100:0;return[{label:o?`Sell the ${re[o].name}`:"Sell a relic",sub:o?`Gain ${n} gold.`:"You have nothing she wants.",disabled:!o,go(a,k){return k.loseRelic(a,o),k.gainGold(a,n),{text:`She tucks the ${re[o].name} into one of her pockets and counts out ${n} gold.`}}},{label:"Buy a curse",sub:"Gain a curse and 120 gold. She pays you to take it.",go(a,k){let r=k.gainCurse(a);return k.gainGold(a,120),{text:`"Pleasure doing business." You are 120 gold richer, and burdened by ${k.relicName(r)}.`}}},{label:"Browse and leave",sub:"Nothing today.",go:()=>({text:'"Come back when you have something shinier," she says.'})}]}});q("frozen_delver",{title:"Frozen in the Ice",art:"ev_frozen",acts:[2,3],text:"A delver stands frozen mid-stride inside a pillar of blue ice, one hand still reaching for something. Their pack hangs half out of the ice.",choices:e=>{let t=8+2*e.act;return[{label:"Thaw them out",sub:`Lose ${t} health to the cold. Gain an uncommon relic.`,disabled:e.player.hp<=t,go(o,n){n.loseHp(o,t);let a=n.gainRelicOfRarity(o,"uncommon");return{text:`Your hands go numb, but the ice gives. The delver gasps, presses the ${n.relicName(a)} on you, and stumbles back toward the surface.`}}},{label:"Chip out the pack",sub:"Gain 30 gold and a potion if you have room.",go(o,n){n.gainGold(o,30);let a=o.player.potions.includes(null)?n.gainPotion(o):null;return{text:`You work the pack free: 30 gold${a?` and a ${n.potionName(a)}`:""}. The delver\u2019s eyes seem to follow you.`}}},{label:"Leave them",sub:"The ice will keep.",go:()=>({text:"You walk on. The cold walks with you a while."})}]}});q("three_candles",{title:"The Three Candles",art:"ev_candles",acts:[1,2,3],text:"Three candles burn on a ledge: red, blue and green. Each flame leans toward you. A carved line beneath reads: ONE, AND ONLY ONE, AND IT WILL COST YOU.",choices:e=>[{label:"Pinch the red flame",sub:"+1 damage per Sword. Lose 6 max health.",go(t,o){return t.player.atk+=1,o.maxHp(t,-6),{text:"It burns. Your sword arm remembers the burn as strength."}}},{label:"Pinch the blue flame",sub:e.player.noArmor?"Your rage has no use for armor.":"+1 armor per Shield and +4 max armor. Lose 6 max health.",disabled:!!e.player.noArmor,go(t,o){return t.player.def+=1,t.player.maxArmor+=4,o.maxHp(t,-6),{text:"It burns cold. Your skin hardens like frost on iron."}}},{label:"Pinch the green flame",sub:"Hearts heal 1 more each. Lose 6 max health.",go(t,o){return t.player.heal+=1,o.maxHp(t,-6),{text:"It burns sweet. The ache in your bones eases into warmth."}}}]});q("mirror_maze",{title:"The Mirror Maze",art:"ev_mirror",acts:[1,2,3],text:"A corridor of black glass splits into a hundred reflections of you. One of them is a half-step behind the others, and smiling.",choices:e=>[{label:"Follow the smiling one",sub:"Even odds: a relic, or a fight with what wears your face.",gamble:{kind:"coin",odds:.5},go(t,o){if(o.luck(t,.5)){let a=o.gainRelicOfRarity(t,"uncommon");return{text:`It leads you to a forgotten alcove and vanishes. On the shelf: the ${o.relicName(a)}.`}}return{text:"It stops smiling. So do the others.",fight:{enemies:{1:["bat","bat"],2:["wraith","archer"],3:["doppel"]}[t.act],kind:"normal"}}}},{label:"Smash your way out",sub:`Lose ${4+e.act*2} health. Gain 35 gold in silvered glass.`,go(t,o){let n=o.loseHp(t,4+t.act*2);return o.gainGold(t,35),{text:`Glass rains down. You cut yourself (${n} health) but pocket the silvered shards.`}}},{label:"Close your eyes and walk",sub:"Nothing gained, nothing lost.",go:()=>({text:"You feel your way along the wall until the reflections stop following."})}]});q("bone_merchant",{title:"The Bone Merchant",art:"ev_bones",acts:[1,2,3],text:'A cheerful skeleton sits behind a cart of polished bones. "Good marrow, fair prices," it rattles. "Buying and selling."',choices:e=>{let t=e.player.relics.includes("bone_charm");return[{label:"Sell some marrow",sub:"Lose 5 max health. Gain 70 gold.",disabled:e.player.maxHp<=30,go(o,n){return n.maxHp(o,-5),n.gainGold(o,70),{text:"It taps your shin with a tiny hammer, listens carefully, and pays in full."}}},{label:t?"Buy a marrow pie":"Buy a bone charm",sub:t?"Pay 30 gold. Heal 20.":"Pay 60 gold. Gain the Bone Charm.",disabled:e.player.gold<(t?30:60),go(o,n){return t?(n.loseGold(o,30),n.heal(o,20),{text:"It is better than it sounds. Much better."}):(n.loseGold(o,60),n.gainRelic(o,"bone_charm"),{text:'It knots a little bone charm around your wrist. "For luck," it says. "And for later."'})}},{label:"Browse politely and leave",sub:"Keep your marrow.",go:()=>({text:'"Come back any time," it calls. "You know where to find bones."'})}]}});q("flooded_shrine",{title:"The Flooded Shrine",art:"ev_flooded",acts:[2,3],text:"A shrine sits at the bottom of a clear, cold pool. Offerings glint on the altar below: coins, flasks, a ring or two.",choices:e=>{let t=6+e.act*2;return[{label:"Dive for the offerings",sub:`Lose ${t} health to the cold. Gain 40 gold and a potion if you have room.`,disabled:e.player.hp<=t,go(o,n){n.loseHp(o,t),n.gainGold(o,40);let a=o.player.potions.includes(null)?n.gainPotion(o):null;return{text:`You come up gasping with 40 gold${a?` and a ${n.potionName(a)}`:""}.`}}},{label:"Pray at the water\u2019s edge",sub:"Remove a curse, or heal 12 if you have none.",go(o,n){let a=n.removeCurse(o);return a?{text:`The water ripples. The weight of ${n.relicName(a)} sinks away from you.`}:(n.heal(o,12),{text:"A calm settles over you. You feel steadier."})}},{label:"Leave the offerings",sub:"They belong to someone.",go:()=>({text:"The water closes over the altar, still and patient."})}]}});q("training_yard",{title:"The Old Training Yard",art:"ev_yard",acts:[1,2,3],text:"Straw dummies stand in rows, slashed and stitched a thousand times. Someone has left a list of drills nailed to a post.",choices:e=>[{label:"Drill the blade",sub:"+1 damage per Sword. Hearts heal 1 less (never below 1).",go(t){return t.player.atk+=1,t.player.heal=Math.max(1,t.player.heal-1),{text:"Hours of cuts. Your arm is iron now; your patience for bandages, less so."}}},{label:"Drill the guard",sub:e.player.noArmor?"Your rage has no use for a guard.":"+1 armor per Shield and +4 max armor. Swords deal 1 less (never below 1).",disabled:!!e.player.noArmor,go(t){return t.player.def+=1,t.player.maxArmor+=4,t.player.atk=Math.max(1,t.player.atk-1),{text:"You learn to stand your ground. Attacking feels a little clumsier."}}},{label:"Nap in the straw",sub:"Heal 12.",go(t,o){return{text:`You wake with straw in your hair, ${o.heal(t,12)} health better.`}}}]});q("knucklebones",{title:"Knucklebones",art:"ev_knuckle",acts:[1,2,3],text:'Three hooded figures crouch around a game of knucklebones. "Stakes are relics," one says, not looking up. "Winner takes something better."',choices:e=>{let t=e.player.relics.filter(o=>re[o]&&re[o].rarity!=="curse");return[{label:"Stake a relic",sub:"Even odds: keep your relics and win a random rare one, or lose a random relic.",gamble:{kind:"dice",odds:.5},disabled:!t.length,go(o,n){let a=n.rng(o),k=t[Math.floor(Ee(a)*t.length)];if(n.luck(o,.5)){let r=n.gainRelicOfRarity(o,"rare");return{text:`The bones fall your way. You keep the ${n.relicName(k)} and win the ${n.relicName(r)}.`}}return n.loseRelic(o,k),{text:`The bones betray you. The ${n.relicName(k)} disappears into a hood.`}}},{label:"Just watch",sub:"Gain 15 gold betting on the side.",go(o,n){return n.gainGold(o,15),{text:"You back the quiet one and win a few coins."}}}]}});q("starlit_pool",{title:"The Starlit Pool",art:"ev_star",acts:[3],text:"Deep in the Vault, a pool reflects stars that are not there. A voice in the water offers one wish, and asks only for a little darkness in return.",choices:()=>[{label:"Wish for strength",sub:"+2 damage per Sword. Gain a curse.",go(e,t){e.player.atk+=2;let o=t.gainCurse(e);return{text:`Power floods your sword arm. Something cold follows it in: ${t.relicName(o)}.`}}},{label:"Wish for life",sub:"+20 max health. Gain a curse.",go(e,t){t.maxHp(e,20);let o=t.gainCurse(e);return{text:`You feel enormous, unkillable. And watched: ${t.relicName(o)}.`}}},{label:"Wish for nothing",sub:"Heal 15.",go(e,t){return t.heal(e,15),{text:"The voice laughs, not unkindly. The water soothes your wounds anyway."}}}]});q("spider_pantry",{title:"The Spider\u2019s Pantry",art:"ev_pantry",acts:[1,2],text:'Silk cocoons hang from the ceiling, swaying gently. One of them is moving and saying "help" in a muffled voice.',choices:e=>[{label:"Cut the delver free",sub:"The owners will notice. Win the fight for a relic.",go(t){return{text:"The delver tumbles out, thanks you, and runs. Eight legs drop from the ceiling.",fight:{enemies:{1:["spider","spider"],2:["basilisk","spiderling","spiderling"]}[t.act]||["spider","spider"],kind:"elite"}}}},{label:"Loot the still cocoons",sub:"Gain 45 gold. You might get bitten.",gamble:{kind:"coin",odds:.6},go(t,o){return o.gainGold(t,45),o.luck(t,.6)?{text:"You find 45 gold among the leftovers and leave quietly."}:{text:`You find 45 gold, and a fang finds you. You lose ${o.loseHp(t,8)} health.`}}},{label:"Leave",sub:"Not your problem.",go:()=>({text:'The "help" follows you down the corridor for a long time.'})}]});q("the_collector",{title:"The Collector",art:"ev_collector",acts:[2,3 rk (blasts), the Shieldwall (armor), the Quiet Hand (win without abilities), Plenty (earn gold), the Straight Path (no Unknown rooms) and Silence (no abilities). Each act now offers three oaths instead of two."],["keg","Blasts pay out in kind","Tiles caught in an Arrow or Burst now count as what they are: popped Hearts heal, Gems give mana, Shields armor, Coins gold, and Swords hit your target. Tiles of your chain\u2019s own kind still add to the chain."],["bone","Gambles you play yourself","Coin tosses, dice and suspicious chests are now a timing game: stop the marker in the gold. The Gambling Golem\u2019s three wheels stop one at a time. The gold zone is as wide as the old odds, so a steady hand beats luck."],["coin","The Weighted Coin","A new relic. Every chance encounter goes your way: no game to play, the Deep simply obliges."],["node_shop","Friendlier early shops","Ryley\u2019s wares cost 60% in Act I and 80% in Act II, so the first shop you reach can actually sell you something."],["p_scroll","The map, any time","Tap the scroll in a shop, campfire or event, or choose View the map from the pause menu in a fight, to see where you are and where the paths lead."],["p_blue","Potion swaps you can see","When your slots are full, taking or buying a potion now shows both potions side by side and asks before anything is thrown away."],["node_treasure","Events show what they give","A strange encounter that hands you a relic or potion now shows the card and what it does, not just its name."],["sword","Fixes from a full code review","Interrupts land when a hit also starts a boss\u2019s second phase, enemies killed by thorns stop mid-attack, the Wyrm and Hollow King return the gold they took, and a dozen smaller fixes."],["lance","Lances and Arrows","Drag a straight line of 4 or more to make a Lance. A Sword Lance slips past thorns and plating, and every Lance leaves an Arrow tile: chain it later and it clears its whole row, column or diagonals."],["keg","Loops and Bursts"
