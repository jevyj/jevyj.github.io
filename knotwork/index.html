id:"heart",berserker:"sword",chronomancer:"gem",monk:"heart",alchemist:"coin",knotweaver:"gem",huntress:"sword",mimic:"gem"},je={warden:{join:'The Warden gets up, tests the shield arm, and nods once. "Behind me, then."',down:'The Warden\u2019s shield drops. "Hold the gate," she says, and does not get up.',errand:{title:"The Warden\u2019s Errand",text:'A banner of the Last Gate lies trampled in the mud here. The Warden stops. "I know whose that was."',choice:"Help her bury it",result:"You dig together, and she says nothing, and that is enough."},talks:[{q:'"Why do you keep coming down here?"',a:[{t:"Someone has to hold the line.",pts:2},{t:"For the gold, like everyone.",pts:1}]},{q:'"Do you ever get tired of standing in front?"',a:[{t:"Every day. I stand there anyway.",pts:2},{t:"I\u2019d rather be behind you, honestly.",pts:1}]},{q:'"If the gate falls, what then?"',a:[{t:"Then we build another.",pts:2},{t:"Then we run.",pts:1}]}]},duelist:{join:'The Duelist flicks blood off a blade and grins. "Try to keep up."',down:"The Duelist goes down mid-lunge, still grinning. The grin stays.",errand:{title:"The Duelist\u2019s Errand",text:'A gutter-court token glints in a crack in the floor. "Mine," the Duelist says. "Lost it in a bet with someone who\u2019s dead now."',choice:"Fish it out",result:'"Should never have bet it," they say, pocketing it. "Thanks."'},talks:[{q:'"Fast or careful?"',a:[{t:"Fast. Careful gets you killed slowly.",pts:2},{t:"Careful. Fast gets you killed quickly.",pts:1}]},{q:'"Ever lost a duel?"',a:[{t:"Only the ones I walked away from.",pts:2},{t:"Plenty.",pts:1}]},{q:'"What do you do with your hands when you\u2019re not fighting?"',a:[{t:"Shuffle cards. Badly.",pts:2},{t:"Nothing. They shake.",pts:1}]}]},pyromancer:{join:'The Pyromancer brushes ash from her sleeves. "Stand upwind of me."',down:"The Pyromancer\u2019s fire gutters out. The cold comes in fast.",errand:{title:"The Pyromancer\u2019s Errand",text:'A scorched page from the Ember Tower lies pinned under a stone. "That\u2019s mine," she says quietly. "That whole shelf was mine."',choice:"Free the page",result:"She reads it twice and tucks it away without a word."},talks:[{q:'"Does the fire ever frighten you?"',a:[{t:"Only when it stops listening.",pts:2},{t:"No. It frightens other people.",pts:1}]},{q:'"Why Gems, of all things?"',a:[{t:"They hold heat the way nothing else does.",pts:2},{t:"They were what the Tower had.",pts:1}]},{q:'"What burned the Tower?"',a:[{t:"Ask me when we\u2019re out.",pts:2},{t:"I did.",pts:1}]}]},druid:{join:'The Druid straightens, and something in the wall roots itself a little deeper. "Walk soft."',down:"The Druid folds to the floor. Moss is already growing where he lay.",errand:{title:"The Druid\u2019s Errand",text:'A pale seedling pushes up between the flagstones, far from any light. "It won\u2019t make it here," the Druid says. "Not without help."',choice:"Carry it to better ground",result:"He plants it by a crack where water runs, and lingers a moment longer than he needs to."},talks:[{q:'"Does the Deep grow anything on purpose?"',a:[{t:"Everything grows on purpose. Even rot.",pts:2},{t:"Only things that bite.",pts:1}]},{q:'"Do you miss the sky?"',a:[{t:"The roots don\u2019t. So I try not to.",pts:2},{t:"Every hour.",pts:1}]},{q:'"Poison seems an odd gift for a keeper of growing things."',a:[{t:"Everything that grows also chooses what dies.",pts:2},{t:"It\u2019s just faster than waiting.",pts:1}]}]},berserker:{join:'The Berserker cracks his neck and laughs. "Finally. Company."',down:"The Berserker roars once more and falls silent, which is somehow worse.",errand:{title:"The Berserker\u2019s Errand",text:'A rusted axe-head is wedged in a door frame at head height. "Red Fjord steel," the Berserker says. "My brother threw like that."',choice:"Work it free",result:'He turns it over, laughs, and hangs it from his belt. "He\u2019d want it back."'},talks:[{q:'"Armor. Why none?"',a:[{t:"Can\u2019t hit what you can\u2019t reach, and I reach first.",pts:2},{t:"Lost it in a game.",pts:1}]},{q:'"What do you think about, in the red?"',a:[{t:"Nothing. That\u2019s the point.",pts:2},{t:"Breakfast.",pts:1}]},{q:'"Afraid of anything?"',a:[{t:"Quiet rooms.",pts:2},{t:"Nothing with a face.",pts:1}]}]},chronomancer:{join:'The Chronomancer checks a watch with no hands. "You\u2019re early. Good."',down:"The Chronomancer\u2019s watch stops. For once, so does she.",errand:{title:"The Chronomancer\u2019s Errand",text:'A clock face is set into the wall, stopped at a quarter past. "I set that," she says. "On the way down. It should still be running."',choice:"Wind it with her",result:"The hands shudder and move. She looks relieved in a way she doesn\u2019t explain."},talks:[{q:'"Have we met before?"',a:[{t:"Several times. You were taller once.",pts:2},{t:"No.",pts:1}]},{q:'"Does rewinding hurt?"',a:[{t:"Only the parts you don\u2019t get back.",pts:2},{t:"Only my pride.",pts:1}]},{q:'"How does this end?"',a:[{t:"Badly, the first few times.",pts:2},{t:"With us leaving. Eventually.",pts:1}]}]},monk:{join:'The Monk bows, unhurried. "I\u2019ll keep the water still."',down:"The Monk sits down very carefully, closes his eyes, and does not open them.",errand:{title:"The Monk\u2019s Errand",text:"A small shrine of stacked stones has been kicked over. The Monk stops and begins, without comment, to rebuild it.",choice:"Stack stones with him",result:'The last stone balances. He breathes out. "Thank you."'},talks:[{q:'"What is still water, exactly?"',a:[{t:"Water that has stopped arguing.",pts:2},{t:"A trick for hitting harder.",pts:1}]},{q:'"Do you ever lose your temper?"',a:[{t:"I keep it somewhere I can find it.",pts:2},{t:"Never.",pts:1}]},{q:'"Why travel with anyone?"',a:[{t:"Stillness is easier to see next to motion.",pts:2},{t:"You carry the gold.",pts:1}]}]},alchemist:{join:'Megan hefts a satchel that clinks. Howie, somewhere, meows. "Don\u2019t touch the green ones."',down:"Megan\u2019s satchel spills. Something in it hisses. Howie is nowhere to be seen.",errand:{title:"Megan\u2019s Errand",text:'A trail of small muddy pawprints leads under a fallen beam. Megan is already on her knees. "Howie? Howie, you absolute\u2014"',choice:"Help lift the beam",result:"Howie strolls out, dusty and unbothered, and sits on her feet. She pretends not to be relieved."},talks:[{q:'"What\u2019s the worst thing you ever brewed?"',a:[{t:"The one that worked.",pts:2},{t:"Soup.",pts:1}]},{q:'"Why bring a cat into a dungeon?"',a:[{t:"He brought me.",pts:2},{t:"He wouldn\u2019t stay home.",pts:1}]},{q:'"Do the potions taste as bad as they look?"',a:[{t:"Worse. That\u2019s how you know.",pts:2},{t:"I\u2019ve never tried one.",pts:1}]}]},knotweaver:{join:'The Knotweaver ties a loop around your wrist and theirs. "So we don\u2019t lose each other."',down:"The Knotweaver\u2019s thread goes slack. The loop on your wrist unties itself.",errand:{title:"The Knotweaver\u2019s Errand",text:'A frayed length of old thread runs along the wall, knotted every arm\u2019s length. "Someone marked a way out," the Knotweaver says. "Badly. Let me."',choice:"Follow and re-knot it",result:'The last knot pulls tight. "There. Whoever follows won\u2019t get lost."'},talks:[{q:'"What was the first thing you ever tied?"',a:[{t:"My own shoe, wrong, for a year.",pts:2},{t:"A noose. For a doll.",pts:1}]},{q:'"Is the Deep a knot or a weave?"',a:[{t:"A knot that thinks it\u2019s a weave.",pts:2},{t:"A mess.",pts:1}]},{q:'"Can anything be untied?"',a:[{t:"Anything. Not everything should be.",pts:2},{t:"Cut it. Faster.",pts:1}]}]},mimic:{join:'The Mimic looks you up and down, then does a passable impression of your stance. "I learn fast. Show me something."',down:"The Mimic falls, still trying to copy the blow that did it.",errand:{title:"The Mimic\u2019s Errand",text:'A page of notes in a cramped hand is pinned to the wall: sketches of monsters, arrows, numbers. "Mine," the Mimic says. "From the first time down. I wrote everything wrong."',choice:"Help correct the notes",result:'She crosses out half the page and laughs. "Better. Next time I\u2019ll be wrong about different things."'},talks:[{q:'"Is it really stealing, if they were going to use it on me?"',a:[{t:"It\u2019s learning. The thief part is the fun.",pts:2},{t:"Yes. Don\u2019t overthink it.",pts:1}]},{q:'"What was the first thing you ever copied?"',a:[{t:"My mother\u2019s laugh. Badly.",pts:2},{t:"A rat\u2019s bite.",pts:1}]},{q:'"Do you have a trick of your own?"',a:[{t:"Knowing which to keep.",pts:2},{t:"Not yet.",pts:1}]}]},huntress:{join:'The Huntress whistles, and a shape with too many teeth slinks out of the dark. "He likes you. Probably."',down:"The Huntress falls. The hound stands over her and will not be moved.",errand:{title:"The Huntress\u2019s Errand",text:'The hound has caught a scent and is pulling hard toward a side passage. "Let him," the Huntress says. "He\u2019s never wrong. Annoyingly."',choice:"Follow the hound",result:"A cache of jerky and arrowheads, long hidden. The hound looks insufferably pleased."},talks:[{q:'"Who trained whom?"',a:[{t:"He did. I\u2019m a slow learner.",pts:2},{t:"I did, obviously.",pts:1}]},{q:'"Do you ever hunt alone?"',a:[{t:"Not since he found me.",pts:2},{t:"When he\u2019s sulking.",pts:1}]},{q:'"What are we hunting, really?"',a:[{t:"A way out that isn\u2019t up.",pts:2},{t:"Dinner.",pts:1}]}]}};var L={rat:{name:"Gutter Rat",sprite:"rat",tier:"normal",act:1,hp:9,xp:3,desc:"Small, quick and always hungry. Bites every turn.",moves:{bite:{name:"Bite",timer:1,fx:[["dmg",2]]}},ai:["bite"]},slime:{name:"Bog Slime",sprite:"slime",tier:"normal",act:1,hp:18,xp:4,desc:"Splits into two Slimelings when it dies.",traits:{split:["slimeling","slimeling"]},moves:{slam:{name:"Slam",timer:2,fx:[["dmg",5]]}},ai:["slam"]},slimeling:{name:"Slimeling",sprite:"slimeling",tier:"minion",act:1,hp:6,xp:1,desc:"A wobbling scrap of slime.",moves:{slap:{name:"Slap",timer:2,fx:[["dmg",2]]}},ai:["slap"]},skeleton:{name hit chance (5%, the Duelist 10%) and critical damage (\xD71.5). Sword chains and damaging abilities can crit; the preview shows your chance, and a crit flashes CRITICAL. Raise it with the Keen Eye and Heavy Hand boons, the Lucky Dagger, the Executioner\u2019s Edge, or Fateful First (your first Sword chain each fight always crits). Beware the Dull Edge curse."],["hero_mimic","A new delver: the Mimic","Student of Monsters. She starts with one ability, Steal: copy the move your target is winding up as an ability of your own for the rest of the run, with its numbers as they stand. Anything but a boss. Hold up to three stolen moves (a fourth replaces the oldest), and start each fight with 2 mana per move you hold. Unlock her by meeting 30 kinds of monster."],["spool","Thread is scarcer","The Loom was filling up too fast. Runs now pay about two fifths of the Thread they did: a full win around 30, a loss on floor 10 around 5. Heat still multiplies it, and what you have already earned is yours."],["hero_druid","Partners and Hearts","At a Fallen Delver, a Wounded Knight or someone Frozen in the Ice, another delver you have unlocked can now join you for the run: one of their two abilities fills your third slot (swap it between fights from the map dock), and they stand beside you with their own health. They cannot attack; enemies sometimes aim at them, and a Shield chain of 4+ guards them for the turn. Health Potions mend them too, and you can armor them: double-tap a Shield tile to hand it over (free, once a turn), or tap their portrait to trade them some of yours. When an enemy turns on them you will know: a red tag on its badge and a streak across the screen. If they fall they are gone for the run and the bond suffers. Every delver remembers: Hearts grow across runs (finishing together, guarding them, campfire talks, their errand on the map, bosses beaten as them) and unlock perks both as partner and when you play them. See Companions on the title screen. Your potions now sit above your health bar to make room."],["node_boss","Act IV: The Unwoven","The Deep goes one act deeper. Below the Vault the weave itself is coming apart: twelve new monsters fray the board (frayed tiles pay half and hold no Lance or loop; any cleanse mends them), three new keepers wait at the bottom, and the Abyss now lies beneath Act IV. Six relics, six boons and four events of its own, and the Act IV map theme and music. A full descent is four acts; the quick descent is still two."],["p_red","Swapped potions aren\u2019t wasted","Trading a potion off a full belt now drinks it on the way out, if it can be drunk outside a fight: health, mana, gold, tonics. The swap screen says so, and a note tells you what you gained. Combat-only potions are still lost, and a new curse, the Spilled Belt, brings back the old way."],["ui_skull","You will know when you\u2019re hexed","When a monster silences, weakens, poisons, burns or frails you, a plate slams across the board saying what it did and for how long, the screen flashes violet, the status chip pulses, the log names the culprit, and silenced abilities wear a SILENCED ribbon until it lifts."],["quill","The Delver\u2019s Map","A new rare relic. While you hold it, every Unknown on the map shows what waits there; tap a revealed node to read its opening lines before you commit."],["node_fight","The Deep is 7\xD77","Every run now plays on the wider board that testers preferred: longer chains, fewer stale turns. Enemies have 40% more health to match. If you miss the old board, the Narrow Weave custom modifier brings back 6\xD76 at the old health."],["node_fight","The Mist","From Act II on, one fight per map is shrouded (a misty node on the map). After your first chain the tiles hide and you weave from memory; a chain that doesn\u2019t connect wastes the turn. Skip it, or take it for half again the experience."],["spool","The Loom: Power knots that mean something","Every ability now has its own three Power knots, written for what it actually does: Smoke Bomb weakens and delays longer, Rewind refunds mana and can be used twice, Quick Brew brews rarer potions, Transmute pays mana back, the wolf bites more. No more \u201C+15% damage\u201D on an ability that deals none. Knots you already wove carry over to the new first and second tiers."],["ui_skull","Meet the monsters","The first time you fight a kind of enemy, it introduces itself: what it is and the tricks it has (plating, drains, wards, wind-ups). Tap any foe during a fight to read about it again."],["shield","Bigger walls, harder hits","Every delver\u2019s armor cap is doubled (the Warden\u2019s is a lower 28, so her Bulwark flows sooner), and enemies hit 12% harder across the board. Shield chains are worth building toward now. The Berserker, who has no armor to double, gets +12 max health instead."],["node_fight","Wide Weave: try a 7\xD77 board","A new Custom-run modifier plays on a 7\xD77 board, with enemies at 140% health to match the longer chains. It is an experiment: tell us whether the Deep should be this wide."],["ab_mend","Two boons for overflow","Bulwark\u2019s Breath turns healing beyond full into an absorb shield for the next enemy turn. Tempered Walls lets armor beyond your cap stretch the cap for the rest of the fight. Both uncommon, both from level-ups and shops."],["ab_fireball","Heat and the Loom","From Heat 4 (Sear) up, nothing carries between fights: every encounter starts with no armor and no mana, as it used to. In return, Heat multiplies the Thread a run earns by 15% per level, so a Heat 10 win pays two and a half times a Heat 0 one."],["shield","Armor and mana carry over","An experiment: half of the armor and mana you end a fight with comes with you into the next one (rounded down, within your caps). Relics that start fights with mana or armor add on top. A new curse, the Frayed Knot, takes the carryover away."],["spool","The Loom","Every run now earns Thread: a point per floor, more for elites, bosses, Heat and a win. Spend it at the Loom (title screen, or straight from the results) on knots that improve an ability for good: cheaper casts, a free third cast, 15\u201330% stronger numbers, a little healing on cast. Six knots per ability, for every ability. The Daily Weave plays without them."],["lance","Every Lance has a trick","A straight chain of 4+ now does something by kind: Shields push your target back a turn (Brace), Hearts cure a harmful status (Cleanse), Gems make your next ability cost 3 less (Focus), Coins turn two tiles into Prisms (Windfall). Swords still pierce."],["seal","Nine new oaths, three to choose from","The Breaker (interrupt wind-ups), the Lance, the Loop, the Spark (blasts), the Shieldwall (armor), the Quiet Hand (win without abilities), Plenty (earn gold), the Straight Path (no Unknown rooms) and Silence (no abilities). Each act now offers three oaths instead of two."],["keg","Blasts pay out in kind","Tiles caught in an Arrow or Burst now count as what they are: popped Hearts heal, Gems give mana, Shields armor, Coins gold, and Swords hit your target. Tiles of your chain\u2019s own kind still add to the chain."],["bone","Gambles you play yourself","Coin tosses, dice and suspicious chests are now a timing game: stop the marker in the gold. The Gambling Golem\u2019s three wheels stop one at a time. The gold zone is as wide as the old odds, so a steady hand beats luck."],["coin","The Weighted Coin","A new relic. Every chance encounter goes your way: no game to play, the Deep simply obliges."],["node_shop","Friendlier early shops","Ryley\u2019s wares cost 60% in Act I and 80% in Act II, so the first shop you reach can actually sell you something."],["p_scroll","The map, any time","Tap the scroll in a shop, campfire or event, or choose View the map from the pause menu in a fight, to see where you are and where the paths lead."],["p_blue","Potion swaps you can see","When your slots are full, taking or buying a potion now shows both potions side by side and asks before anything is thrown away."],["node_treasure","Events show what they give","A strange encounter that hands you a relic or potion now shows the card and what it does, not just its name."],["sword","Fixes from a full code review","Interrupts land when a hit also starts a boss\u2019s second phase, enemies killed by thorns stop mid-attack, the Wyrm and Hollow King return the gold they took, and a dozen smaller fixes."],["lance","Lances and Arrows","Drag a straight line of 4 or more to make a Lance. A Sword Lance slips past thorns and plating, and every Lance leaves an Arrow tile: chain it later and it clears its whole row, column or diagonals."],["keg","Loops and Bursts","Close a loop, a chain of 4+ that ends next to where it began, to leave a Burst tile. Chain it and it pops every tile around it. Popped tiles add to your chain, and one blast can set off another."],["thorncrown","Thorns you can beat","Thorns now prick you for each Sword in the chain, and the preview shows exactly how much. Armor soaks it, a Lance slips past, and blasts add damage without adding pricks."],["ab_transmute","Transmute, rebalanced","Transmute now costs 2 more mana each time you use it in a fight. It\u2019s still a big play, just not every turn."],["quiver","New boons, relics and achievements","Fletcher, Powder Keg and Sharpshooter power up your shapes. The Powder Horn starts each fight with an Arrow and a Burst, the Blasting Cap makes every blast hit your target, and three new achievements are waiting."],["dummy","A tutorial","New to the Deep, or showing a friend? Ryley walks you through the basics against a training dummy in about a minute. Tap Tutorial on the title screen."],["howie","Howie, the Little Menace","A fluffy black cat now keeps the Sunken Crypt. He sits on your tiles, knocks your potions off the table and wiggles before he pounces. He guards Act I until you have met him."],["hero_megan","Megan, the witch","The potion-brewing delver is now Megan, a witch with a bottomles
